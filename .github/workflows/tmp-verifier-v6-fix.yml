name: tmp-verifier-v6-fix
on:
  push:
    branches:
      - fix/certification-v6-engine-version-parity
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch and test
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          printf '%s' '' | base64 -d > internal/chain/engine_version_hash_test.go
          printf '%s' '' | base64 -d > internal/envelope/certification_v6_test.go
          gofmt -w internal/chain/entry.go internal/chain/engine_version_hash_test.go internal/envelope/model.go internal/envelope/verify.go internal/envelope/certification_v6_test.go
          go test ./...
          git diff --check
          rm .github/workflows/tmp-verifier-v6-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/chain/entry.go internal/chain/engine_version_hash_test.go internal/envelope/model.go internal/envelope/verify.go internal/envelope/certification_v6_test.go .github/workflows/tmp-verifier-v6-fix.yml
          git commit -m "fix: verify certified v6 bundles and v5 engine version"
          git push origin HEAD:fix/certification-v6-engine-version-parity
