name: tmp-verifier-v6-fix
on:
  push:
    branches:
      - fix/certification-v6-engine-version-parity
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply verifier parity fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # 1) v5 chain canonical parity: engine_version is explicitly bound by the frozen spec.
          replace(
              "internal/chain/entry.go",
              '''//   - "engine_version" is additive metadata — it was NOT included in
//     the hash when the runtime produced the entry.  Removing it here
//     keeps the verifier's recomputed hash consistent with the stored
//     entry_hash regardless of whether the field is present in the
//     exported JSON.
''',
              '''//   - "engine_version" is part of the frozen v5 top-level schema and is
//     bound into the entry hash. The producer and canonical-form spec both
//     include it when present; the verifier must therefore preserve it.
''')
          replace(
              "internal/chain/entry.go",
              '''\tdelete(m, "entry_hash")
\tdelete(m, "signature")
\tdelete(m, "engine_version") // additive metadata — not in chain hash (audit chain v5)
\treturn canonical.Bytes(m)
''',
              '''\tdelete(m, "entry_hash")
\tdelete(m, "signature")
\treturn canonical.Bytes(m)
''')

          # 2) Certification v6 model support + complete census/hash contract.
          replace(
              "internal/envelope/model.go",
              '''\tCodeUnsupportedCertificationVersion FailureCode = "UNSUPPORTED_CERTIFICATION_VERSION"
\tCodeCertificationCountMismatch      FailureCode = "CERTIFICATION_COUNT_MISMATCH"
''',
              '''\tCodeUnsupportedCertificationVersion FailureCode = "UNSUPPORTED_CERTIFICATION_VERSION"
\tCodeCertificationCountMismatch      FailureCode = "CERTIFICATION_COUNT_MISMATCH"
\tCodeCertificationBundleHashMismatch FailureCode = "CERTIFICATION_BUNDLE_HASH_MISMATCH"
''')
          replace(
              "internal/envelope/model.go",
              '''const SupportedCertificationVersion = 5
''',
              '''const SupportedCertificationVersion = 6
''')
          replace(
              "internal/envelope/model.go",
              '''\tEvaluations   []json.RawMessage `json:"evaluations"`
\tVerifications []VerificationRow `json:"verification_events"`
\tCorrelations  []CorrelationRow  `json:"correlation_events"`

\t// Evidence Archive sections, added at certification version 5. Absent on
''',
              '''\tEvaluations           []json.RawMessage `json:"evaluations"`
\tContextEnvelopes      []json.RawMessage `json:"context_envelopes"`
\tGovernanceTransitions []json.RawMessage `json:"governance_transitions"`
\tAdminLog              []json.RawMessage `json:"admin_log"`
\tVerifications         []VerificationRow `json:"verification_events"`
\tExceptionEvents       []json.RawMessage `json:"exception_events"`
\tCorrelations          []CorrelationRow  `json:"correlation_events"`

\t// Evidence Archive sections, added at certification version 5. Absent on
''')
          replace(
              "internal/envelope/model.go",
              '''\tRetrievals []RetrievalRow `json:"retrieval_events"`
\tProbes     []ProbeRow     `json:"probe_events"`

\t// Certification is the certified-copy manifest when the export requested
''',
              '''\tRetrievals               []RetrievalRow    `json:"retrieval_events"`
\tProbes                   []ProbeRow        `json:"probe_events"`
\tProtectionConfigurations []json.RawMessage `json:"protection_configurations"`

\t// Certification is the certified-copy manifest when the export requested
''')
          replace(
              "internal/envelope/model.go",
              '''type Certification struct {
\tVersion      int                       `json:"version"`
\tRecordCounts CertificationRecordCounts `json:"record_counts"`
}
''',
              '''type Certification struct {
\tVersion      int                       `json:"version"`
\tRecordCounts CertificationRecordCounts `json:"record_counts"`
\tBundleSHA256 string                    `json:"bundle_sha256"`
}
''')
          replace(
              "internal/envelope/model.go",
              '''type CertificationRecordCounts struct {
\tEvaluations        *int `json:"evaluations"`
\tVerificationEvents *int `json:"verification_events"`
\tCorrelationEvents  *int `json:"correlation_events"`
\tRetrievalEvents    *int `json:"retrieval_events"`
\tProbeEvents        *int `json:"probe_events"`
}
''',
              '''type CertificationRecordCounts struct {
\tEvaluations              *int `json:"evaluations"`
\tContextEnvelopes         *int `json:"context_envelopes"`
\tGovernanceTransitions    *int `json:"governance_transitions"`
\tAdminLog                 *int `json:"admin_log"`
\tVerificationEvents       *int `json:"verification_events"`
\tExceptionEvents          *int `json:"exception_events"`
\tCorrelationEvents        *int `json:"correlation_events"`
\tRetrievalEvents          *int `json:"retrieval_events"`
\tProbeEvents              *int `json:"probe_events"`
\tProtectionConfigurations *int `json:"protection_configurations"`
\tTotal                    *int `json:"total"`
}
''')

          # 3) Recompute the certified-copy fingerprint using the producer's version-keyed formula.
          replace(
              "internal/envelope/verify.go",
              '''\t"crypto/ed25519"
\t"crypto/x509"
\t"encoding/base64"
\t"encoding/json"
''',
              '''\t"crypto/ed25519"
\t"crypto/sha256"
\t"crypto/x509"
\t"encoding/base64"
\t"encoding/hex"
\t"encoding/json"
''')
          replace(
              "internal/envelope/verify.go",
              '''\t// (5) Certification census cross-check. A manifest claiming more records
\t// than the bundle carries is what a truncated export looks like from the
\t// outside; a manifest claiming fewer means sections were appended after it
\t// was written. Either way the signed count and the signed arrays disagree,
\t// which the reader must be told.
\tcheckCertificationCounts(&env, res)

\treturn res, nil
''',
              '''\t// (5) Certification completeness cross-check. Counts catch section-level
\t// truncation/addition; bundle_sha256 binds the exact canonical contents of
\t// every section covered by that certification version.
\tcheckCertificationCounts(&env, res)
\tcheckCertificationBundleHash(raw, &env, res)

\treturn res, nil
''')
          replace(
              "internal/envelope/verify.go",
              '''\tcmp("evaluations", rc.Evaluations, len(env.Evaluations))
\tcmp("verification_events", rc.VerificationEvents, len(env.Verifications))
\tcmp("correlation_events", rc.CorrelationEvents, len(env.Correlations))
\tcmp("retrieval_events", rc.RetrievalEvents, len(env.Retrievals))
\tcmp("probe_events", rc.ProbeEvents, len(env.Probes))
}

// VerifyNDJSONLedgerOnly wraps the legacy NDJSON path so the CLI can present a
''',
              '''\tcmp("evaluations", rc.Evaluations, len(env.Evaluations))
\tcmp("context_envelopes", rc.ContextEnvelopes, len(env.ContextEnvelopes))
\tcmp("governance_transitions", rc.GovernanceTransitions, len(env.GovernanceTransitions))
\tcmp("admin_log", rc.AdminLog, len(env.AdminLog))
\tcmp("verification_events", rc.VerificationEvents, len(env.Verifications))
\tcmp("exception_events", rc.ExceptionEvents, len(env.ExceptionEvents))
\tcmp("correlation_events", rc.CorrelationEvents, len(env.Correlations))
\tcmp("retrieval_events", rc.RetrievalEvents, len(env.Retrievals))
\tcmp("probe_events", rc.ProbeEvents, len(env.Probes))
\tcmp("protection_configurations", rc.ProtectionConfigurations, len(env.ProtectionConfigurations))
\tif rc.Total != nil {
\t\tactualTotal := len(env.Evaluations) + len(env.ContextEnvelopes) + len(env.GovernanceTransitions) +
\t\t\tlen(env.AdminLog) + len(env.Verifications) + len(env.ExceptionEvents) + len(env.Correlations) +
\t\t\tlen(env.Retrievals) + len(env.Probes) + len(env.ProtectionConfigurations)
\t\tcmp("total", rc.Total, actualTotal)
\t}
}

// checkCertificationBundleHash recomputes the manifest fingerprint from the
// exact signed envelope bytes. The section set is keyed by certification
// version so legacy v1-v5 copies retain their historical formula while v6 adds
// protection_configurations. Missing sections are canonically represented as
// empty arrays, matching the producer's defaults.
func checkCertificationBundleHash(raw []byte, env *Envelope, res *VerificationResult) {
\tif env.Certification == nil {
\t\treturn
\t}
\twant := env.Certification.BundleSHA256
\tif want == "" {
\t\tres.AddFinding(CodeCertificationBundleHashMismatch, "bundle_sha256", "certification manifest carries no bundle_sha256")
\t\treturn
\t}
\tgot, err := computeCertificationBundleSha256(raw, env.Certification.Version)
\tif err != nil {
\t\tres.AddFinding(CodeCertificationBundleHashMismatch, "bundle_sha256", "cannot recompute certified bundle fingerprint: "+err.Error())
\t\treturn
\t}
\tif got != want {
\t\tres.AddFinding(CodeCertificationBundleHashMismatch, "bundle_sha256",
\t\t\tfmt.Sprintf("certification bundle_sha256 mismatch: manifest=%s recomputed=%s", want, got))
\t}
}

func computeCertificationBundleSha256(raw []byte, version int) (string, error) {
\tdec := json.NewDecoder(bytes.NewReader(raw))
\tdec.UseNumber()
\tvar root map[string]any
\tif err := dec.Decode(&root); err != nil {
\t\treturn "", fmt.Errorf("parse envelope: %w", err)
\t}
\n\tmaterial := make(map[string]any)
\taddSection := func(name string) error {
\t\tv, ok := root[name]
\t\tif !ok || v == nil {
\t\t\tmaterial[name] = []any{}
\t\t\treturn nil
\t\t}
\t\tarr, ok := v.([]any)
\t\tif !ok {
\t\t\treturn fmt.Errorf("section %s is not an array", name)
\t\t}
\t\tmaterial[name] = arr
\t\treturn nil
\t}

\tsections := []string{"evaluations", "context_envelopes", "governance_transitions", "admin_log"}
\tif version >= 2 {
\t\tsections = append(sections, "verification_events")
\t}
\tif version >= 3 {
\t\tsections = append(sections, "exception_events")
\t}
\tif version >= 4 {
\t\tsections = append(sections, "correlation_events")
\t}
\tif version >= 5 {
\t\tsections = append(sections, "retrieval_events", "probe_events")
\t}
\tif version >= 6 {
\t\tsections = append(sections, "protection_configurations")
\t}
\tfor _, name := range sections {
\t\tif err := addSection(name); err != nil {
\t\t\treturn "", err
\t\t}
\t}

\tcanonical, err := jcs.Canonicalize(material)
\tif err != nil {
\t\treturn "", fmt.Errorf("canonicalize certified record set: %w", err)
\t}
\tsum := sha256.Sum256(canonical)
\treturn hex.EncodeToString(sum[:]), nil
}

